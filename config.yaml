# Number of complete sampling + PPO update rounds (each round uses all workers).
max_episodes: 2500

# Save SUMO detector logs named ild.out during sampling, validation and evaluation.
# false discards only their file output; detectors and live measurements remain active.
# Existing files are not deleted. Other outputs (CSV, TripInfo, metrics, etc.) remain.
output_ild: true

# Unicorn training module: unicorn (scalar Critic) or disppo (quantile Critic).
# Shared Actor, simulator, auxiliary losses and training/validation lifecycle.
# Both use corrected (A - mean(A)) / (std(A) + eps) advantage normalization.
# DisPPO preserves the scalar phase-value sum as its distribution mean and adds
# ordered, zero-mean junction offsets. No mean-pooled value replacement.
# Frozen when resuming a run. Evaluation reads the architecture from checkpoint.
ppo_variant: unicorn
disppo:
  # Odd count >= 3; default is the previously tested 17-quantile head.
  num_quantiles: 17
  # TD(lambda) distributional targets; gamma stays at NETWORK_PARAMS.GAMMA.
  gae_lambda: 0.95
  huber_kappa: 1.0
  # Initial distance between neighboring quantiles (traffic return units).
  initial_quantile_spacing: 0.1
  # Optional per-quantile value clipping; null matches the tested adaptation.
  value_clip: null

# PPO policy clipping for either Unicorn ppo_variant and for HeteroLight.
# fixed_clipping: original fixed [0.8, 1.2] surrogate.
# kl2clip: tested discrete KL2Clip bounds (KL budget 0.006164264416724914).
# dppo_full_tv: tested full legal-phase TV gate (radius 0.05).
# Frozen for the run: keep unchanged when using --resume-run.
clipping: fixed_clipping

# J3: calibrated VAE KL + Free Nats + action-conditioned latent TD prediction.
# false retains the existing training path; true enables the joint mechanism.
# Independent of ppo_variant/clipping/AES. Frozen when resuming a run.
advanced_vae: false
advanced_vae_config:
  # Fixed independent Grid5x5 calibration used in the J3 experiment.
  # beta multiplies MEAN per-vector KL inside the existing VAE loss coefficient.
  actor_kl_beta: 0.05337935120662157
  critic_kl_beta: 0.05419863990588785
  free_nats: 0.1  # nats per complete latent vector, not per dimension
  latent_dim: 32
  td_discount: 0.9  # auxiliary prediction horizon; PPO gamma stays unchanged
  ema_decay: 0.99  # one target update after each complete PPO update
  loss_coefficient: 0.001
  variance_coefficient: 1.0
  covariance_coefficient: 0.01
  initialization_seed: 9017  # isolated from policy/training random streams
  log_interval: 50  # extra backbone-gradient diagnostic; losses logged every update

# Unicorn training only. Independent of ppo_variant and clipping.
# false preserves the current fixed entropy coefficient 0.002 and training path.
# true uses global AES; DisPPO supplies the mean of its sampled quantiles.
# Frozen when resuming; AES changes training, not frozen-model evaluation.
aes: false
aes_config:
  q: 0.9
  ema_decay: 0.95
  # Independent 40-update Grid5x5 pilot calibration; configurable for new studies.
  kappa: 0.0016828572303074895
  minimum: 0.0004
  maximum: 0.008

training:
  # single: one network; joint: at least two different networks, one shared model.
  # Worker count is the sum of workers below. Single-mode defaults retain six.
  mode: single
  seed: 0
  networks:
    - name: grid_network_5_5
      workers: 6
  # Official six-network joint setup: set mode: joint and replace networks with:
  #   - {name: cologne_network_8, workers: 1}
  #   - {name: ingolstadt_network_21, workers: 1}
  #   - {name: arterial_network_4_4, workers: 1}
  #   - {name: grid_network_4_4, workers: 1}
  #   - {name: shaoxing_network_7, workers: 1}
  #   - {name: shenzhen_network_29, workers: 1}

validation:
  # Validate every training network after this many completed PPO updates.
  # Also validates at the final update; each validation commits a resumable checkpoint.
  interval: 100
  seeds: [21001, 21002, 21003, 21004, 21005]
  policy_seed: 2026
  max_steps: 3600
  # T-REX-inspired selection: minimize mean travel time on fixed validation seeds.
  # This evaluates ONE frozen checkpoint, not a window of changing training policies.
  # Joint mode gives each training-network mean equal weight. Test data never select.
  # Every network/seed needs completed trips and finite positive ATT.
  metric: ATT

# Retrospective T-REX-inspired analysis; does not stop or change training.
# Windows count validation observations (100 PPO updates apart by default).
convergence:
  smoothing_window: 3
  final_window: 5
  relative_tolerance: 0.05
  minimum_stable_updates: 500

early_stopping:
  enabled: false
  # Validate/select best throughout training; only count patience AFTER this update.
  min_updates: 1000
  # Number of consecutive validations without significant valid improvement.
  patience: 3
  # Cumulative decrease from the last significant validation ATT improvement (1%).
  # Smaller valid decreases still update best_model, but do not reset patience.
  min_relative_improvement: 0.01

checkpoints:
  # Independent of validation.interval: limit work lost after interruption.
  interval: 50
  keep: 2

sumo:
  # Simulation backend: libsumo or traci. Both use SUMO 1.16.0.
  backend: libsumo

evaluation:
  # Unicorn, HeteroLight, FixedTime, Greedy, MaxPressure
  algorithm: Unicorn
  # Use train_outputs/<algorithm>/<run>/models/best_model.pkl for both tests.
  # Relative paths start at this project root. Use null for rule-based methods.
  checkpoint: train_outputs/Unicorn/Unicorn_20261125_220214_155994/models/best_model.pkl
  network: grid_network_5_5
  seeds: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900]
  policy_seed: 21
  # Simulated seconds, excluding a scenario's initial clock offset.
  max_steps: 3600
  # Evaluation writes data/metrics.json: ATT/AWT of completed trips (s),
  # and LibSignal SUMO AQL (veh/intersection, 200 m detection distance).
  # The same JSON also summarizes the six Unicorn-paper metrics from the CSVs.

# New run: python driver_unicorn.py (or driver_heterolight.py).
# Resume the SAME run: python driver_unicorn.py --resume-run train_outputs/Unicorn/<run>
# Keep training/validation settings unchanged when resuming; target evaluation.network
# and evaluation.checkpoint can change for same-network / unseen-network testing.
#
# train_outputs/<algorithm>/<run>/
#   models/best_model.pkl               lowest validation ATT; absent if none is valid
#   models/checkpoints/checkpoint_*.pkl last checkpoints.keep complete training states
#   models/sampling_weights.pth         internal worker exchange; overwritten
#   validation/update_XXXXXXXX/         candidate validation CSVs + metrics
#   validation/selection.json           all validation scores and selection decisions
#   convergence/learning_data.json      standalone source data for analysis/plots
#   convergence/summary.json            empirical Tc/CR/FPD, or explicit failure reason
#   convergence/learning_curve.png      regenerated with python convergence.py --input <learning_data.json>
#   convergence/training_rewards.jsonl  per-update rewards; rolled back on resume
#   tensorboard/                        training and validation curves
#   simulation/                         per-worker training simulation outputs
# Early-stop counters and stop reason are committed with the training checkpoint.
# A normally early-stopped run is complete; --resume-run does not restart it.
# Historical runs are kept as they are; new training uses only this layout/format.
