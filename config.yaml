# Number of complete sampling + PPO update rounds (each round uses all workers).
max_episodes: 3000

# Unicorn training module: unicorn (scalar Critic) or disppo (quantile Critic).
# Shared Actor, simulator, auxiliary losses and training/validation lifecycle.
# Both use corrected (A - mean(A)) / (std(A) + eps) advantage normalization.
# DisPPO preserves the scalar phase-value sum as its distribution mean and adds
# ordered, zero-mean junction offsets. No mean-pooled value replacement.
# Frozen when resuming a run. Evaluation reads the architecture from checkpoint.
ppo_variant: unicorn
disppo:
  # Odd count >= 3; default is the previously tested 17-quantile head.
  num_quantiles: 17
  # TD(lambda) distributional targets; gamma stays at NETWORK_PARAMS.GAMMA.
  gae_lambda: 0.95
  huber_kappa: 1.0
  # Initial distance between neighboring quantiles (traffic return units).
  initial_quantile_spacing: 0.1
  # Optional per-quantile value clipping; null matches the tested adaptation.
  value_clip: null

# PPO policy clipping for either Unicorn ppo_variant and for HeteroLight.
# fixed_clipping: original fixed [0.8, 1.2] surrogate.
# kl2clip: tested discrete KL2Clip bounds (KL budget 0.006164264416724914).
# dppo_full_tv: tested full legal-phase TV gate (radius 0.05).
# Frozen for the run: keep unchanged when using --resume-run.
clipping: fixed_clipping

training:
  network: grid_network_5_5
  seed: 0

validation:
  # Validate on the training network after this many completed PPO updates.
  # Also validates at the final update; each validation commits a resumable checkpoint.
  interval: 200
  seeds: [21001, 21002, 21003, 21004, 21005]
  policy_seed: 2026
  max_steps: 3600
  # Minimize source-network Queue Length; invalid/empty-trip runs cannot win.
  metric: Queue Length
  completion_reference: MaxPressure
  # Per validation seed: candidate completed veh/s >= reference completed veh/s * ratio.
  # 1.0 means at least the reference flow; fix this rule before the experiment.
  min_completion_ratio: 1.0

early_stopping:
  enabled: false
  # Validate/select best throughout training; only count patience AFTER this update.
  min_updates: 1000
  # Number of consecutive validations without significant eligible improvement.
  patience: 3
  # Cumulative decrease from the last significant Queue Length improvement (1%).
  # Smaller eligible decreases still update best_model, but do not reset patience.
  min_relative_improvement: 0.01

checkpoints:
  # Independent of validation.interval: limit work lost after interruption.
  interval: 300
  keep: 2

sumo:
  # Simulation backend: libsumo or traci. Both use SUMO 1.16.0.
  backend: libsumo

evaluation:
  # Unicorn, HeteroLight, FixedTime, Greedy, MaxPressure
  algorithm: Unicorn
  # Use train_outputs/<algorithm>/<run>/models/best_model.pkl for both tests.
  # Relative paths start at this project root. Use null for rule-based methods.
  checkpoint: train_outputs/Unicorn/Unicorn_20261121_081115_932477/models/best_model.pkl
  network: grid_network_5_5
  seeds: [1000, 1100, 1200, 1300, 1400, 1500, 1600, 1700, 1800, 1900]
  policy_seed: 21
  # Simulated seconds, excluding a scenario's initial clock offset.
  max_steps: 3600
  # Evaluation writes data/metrics.json: ATT/AWT of completed trips (s),
  # and LibSignal SUMO AQL (veh/intersection, 200 m detection distance).
  # The same JSON also summarizes the six Unicorn-paper metrics from the CSVs.

# New run: python driver_unicorn.py (or driver_heterolight.py).
# Resume the SAME run: python driver_unicorn.py --resume-run train_outputs/Unicorn/<run>
# Keep training/validation settings unchanged when resuming; target evaluation.network
# and evaluation.checkpoint can change for same-network / unseen-network testing.
#
# train_outputs/<algorithm>/<run>/
#   models/best_model.pkl               selected weights; absent if none qualifies
#   models/checkpoints/checkpoint_*.pkl last checkpoints.keep complete training states
#   models/sampling_weights.pth         internal worker exchange; overwritten
#   validation/reference/               fixed MaxPressure validation results
#   validation/update_XXXXXXXX/         candidate validation CSVs + metrics
#   validation/selection.json           all validation scores and selection decisions
#   tensorboard/                        training and validation curves
#   simulation/                         per-worker training simulation outputs
# Early-stop counters and stop reason are committed with the training checkpoint.
# A normally early-stopped run is complete; --resume-run does not restart it.
# Historical runs are kept as they are; new training uses only this layout/format.
